spring.application.name=New_project

# ------------------------------------
# Server Config
# ------------------------------------
server.port=6060

# ------------------------------------
# Database Config (PostgreSQL)
# ------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Nagpur123!
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------
# JPA & Hibernate
# ------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------
# Thymeleaf
# ------------------------------------
spring.thymeleaf.cache=false

# ------------------------------------
# Spring Security (Do not use the default login properties)
# ------------------------------------
# Custom login page URL is already configured in SecurityConfig, so no need for default credentials here.

# ------------------------------------
# Logging
# ------------------------------------
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
