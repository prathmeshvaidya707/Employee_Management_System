<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Form</title>
    <!-- Add this inside the <head> tag -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h3>Save Employee</h3>
    <form th:action="@{/employees/save}" th:object="${employee}" method="post" class="border p-4 bg-light shadow rounded">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <input type="text" th:field="*{firstname}" class="form-control" placeholder="First Name" required>
        </div>
        <div class="mb-3">
            <input type="text" th:field="*{lastname}" class="form-control" placeholder="Last Name" required>
        </div>
        <div class="mb-3">
            <input type="text" th:field="*{email}" class="form-control" placeholder="Email" pattern=".*\.com$" required>
            <div th:if="${emailError}" class="text-danger mt-1" th:text="${emailError}"></div>
        </div>
        <div class="mb-3">
            <input type="password" th:field="*{password}" class="form-control" placeholder="Password" required>
        </div>
        <div class="mb-3">
            <label for="role" class="form-label">Select Role</label>
            <select th:field="*{role.id}" class="form-select" id="role" required>
                <option value="" disabled selected>Select a role</option>
                <option th:each="role : ${roles}"
                        th:value="${role.id}"
                        th:text="${role.roleName}">
                </option>
            </select>

        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/employees/list}" class="btn btn-secondary ms-2">Back</a>
    </form>
</div>
</body>
</html>
