<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Employee Directory - PrimeCore Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f0f4f8;
        }
        .company-header {
            background-color: #004080;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgb(0 64 128 / 0.3);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
        }
        .company-header img {
            height: 60px;
            margin-right: 15px;
        }
        .table {
            background-color: white;
            border-radius: 8px;
        }
        .btn-primary {
            background-color: #004080;
            border-color: #004080;
        }
        .btn-primary:hover {
            background-color: #003366;
            border-color: #003366;
        }
        .logged-in-user {
            font-weight: 500;
            font-size: 1rem;
            margin-left: auto;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="company-header">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0os8CevbQyDjvOzjlkqjXQWdLZ0byvuoPqg&s" alt="PrimeCore Solutions Logo">
        <h1 class="mb-0">PrimeCore Solutions</h1>
        <div class="logged-in-user text-white"
             th:if="${loggedInUser != null}"
             th:text="'Logged in as: ' + ${loggedInUser.firstname} + ' ' + ${loggedInUser.lastname}">
            Logged in as: User Name
        </div>
    </div>

    <h2>Employee Directory</h2>

    <!-- Add Employee + Logout on same row -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/employees/showFormForAdd}" class="btn btn-primary" method="post">Add Employee</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger">Logout</button>
        </form>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}"></td>
            <td th:text="${emp.firstname}"></td>
            <td th:text="${emp.lastname}"></td>
            <td th:text="${emp.email}"></td>
            <td th:text="${emp.role.roleName}"></td>
            <td>
                <a th:href="@{/employees/showFormForUpdate(employeeId=${emp.id})}"
                   sec:authorize="hasAnyRole('ROLE_MANAGER', 'ROLE_ADMIN')"
                   class="btn btn-sm btn-warning">Update</a>

                <a th:href="@{/access-denied}"
                   sec:authorize="hasRole('ROLE_EMPLOYEE')"
                   class="btn btn-sm btn-warning">Update</a>

                <a th:href="@{/employees/delete(employeeId=${emp.id})}"
                   sec:authorize="hasRole('ROLE_ADMIN')"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this employee?')">Delete</a>

                <a th:href="@{/access-denied}"
                   sec:authorize="!hasRole('ROLE_ADMIN')"
                   class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>


    <div class="d-flex justify-content-between align-items-center mb-3">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger">Logout</button>
        </form>
    </div>

</div>
</body>
</html>
