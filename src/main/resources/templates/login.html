<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Company Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #f0f4f8, #d9e2ec);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            max-width: 400px;
            margin: 80px auto;
        }
        .login-card {
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .logo {
            max-width: 100px;
            margin-bottom: 20px;
        }
        .company-name {
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container login-container">
    <div class="card login-card bg-white">
        <div class="text-center">
            <!-- Placeholder logo -->
            <img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0os8CevbQyDjvOzjlkqjXQWdLZ0byvuoPqg&s class="logo" alt="Company Logo">
            <div class="company-name">PrimeCore Solutions</div>
            <h4 class="mb-3">Login to Your Account</h4>
        </div>

        <form th:action="@{/authenticateTheUser}" method="post">
            <div th:if="${param.error}">
                <div class="alert alert-danger">Invalid username and password.</div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="example@gmail.com" pattern=".*\.com$" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>

        </form>
    </div>
</div>
</body>
</html>
